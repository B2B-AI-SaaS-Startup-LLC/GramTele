[package]
name = "tg-mtproto"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
aes = "0.9"
ctr = "0.10"
ige = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tg-base = { path = "../tg-base" }
tg-runtime = { path = "../tg-runtime" }
tg-scheme = { path = "../tg-scheme" }
tg-tl = { path = "../tg-tl" }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
zeroize = "1.8"
